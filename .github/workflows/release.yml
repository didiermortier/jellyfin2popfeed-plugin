name: Release Plugin

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 9.0.x
    
    - name: Add Jellyfin NuGet source
      run: dotnet nuget add source https://repo.jellyfin.org/nuget/ --name jellyfin
    
    - name: Restore dependencies
      run: dotnet restore Jellyfin.Plugin.Jellyfin2PopFeed/Jellyfin.Plugin.Jellyfin2PopFeed.csproj
    
    - name: Build
      run: dotnet build Jellyfin.Plugin.Jellyfin2PopFeed/Jellyfin.Plugin.Jellyfin2PopFeed.csproj --configuration Release --no-restore --output ./artifacts
    
    - name: Create ZIP
      run: |
        mkdir -p release
        cd artifacts
        zip ../release/Jellyfin2PopFeed.zip Jellyfin.Plugin.Jellyfin2PopFeed.dll
        cd ..
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: release/Jellyfin2PopFeed.zip
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
